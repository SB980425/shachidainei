capital:
  total_allocated: 220.0
  max_per_market: 200.0
  reserve_ratio: 0.10
  auto_scale_by_balance: true
  balance_refresh_seconds: 60
  min_balance_size_scale: 0.50
  max_balance_size_scale: 1.50

# 毒性流量检测 (VPIN)
toxicity:
  bucket_volume: 500.0
  n_buckets: 50
  toxic_threshold: 0.70
  withdraw_threshold: 0.85
  spread_scale_factor: 2.0
  cooldown_seconds: 5.0

# 自适应报价刷新频率
adaptive_refresh:
  enabled: true
  fast_refresh_ms: 100
  fill_rate_threshold: 2.0
  window_seconds: 5.0

# 连续同向成交急停
burst_guard:
  window_seconds: 5.0
  max_same_side: 3
  pause_seconds: 5.0

# 成交后冷却期
cooldown:
  post_fill_seconds: 2.0

# 单边挂单: 有库存时只挂减仓方向
inventory_only_reduce: true

# Orderbook 最低厚度要求 (USDC notional)
min_book_depth_notional: 500.0
